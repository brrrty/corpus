name: Corpus

# Builds every site in sites.toml with its own 11ty and with Brrrty, one
# runner per site, and diffs the outputs. Sites are cloned inside the runner
# only; nothing from them is committed here.
#
# This repo is public. Site jobs run third-party code, so: no secrets, no
# caches (a site job could poison one), read-only contents, and every
# artifact expires after a day (results are copied out by the reader).

on:
  workflow_dispatch:
    inputs:
      brrrty_ref:
        description: brrrty/brrrty branch, tag or commit to test
        required: true
        default: main
      site:
        description: Only this site (owner/name); empty runs them all
        required: false
        default: ""
  schedule:
    - cron: "23 6 * * 1"

permissions:
  contents: read

env:
  BRRRTY_REF: ${{ inputs.brrrty_ref || 'main' }}

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      sites: ${{ steps.list.outputs.sites }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: list
        env:
          ONLY: ${{ inputs.site }}
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os, tomllib
          sites = tomllib.load(open("sites.toml", "rb"))["site"]
          only = os.environ.get("ONLY", "").strip()
          if only:
              sites = [s for s in sites if only in (s["repo"], s["repo"].replace("/", "__"))]
              if not sites:
                  raise SystemExit(f"no site in sites.toml matches {only!r}")
          matrix = [
              {"repo": s["repo"], "slug": s["repo"].replace("/", "__"), "node": s.get("node", "24")}
              for s in sites
          ]
          print("sites=" + json.dumps(matrix))
          PY

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: brrrty/brrrty
          ref: ${{ env.BRRRTY_REF }}
          path: brrrty
          persist-credentials: false
      - name: Build brrrty and xtask
        working-directory: brrrty
        run: |
          cargo build --release --locked -p brrrty -p xtask
          mkdir -p "$RUNNER_TEMP/bin"
          cp target/release/brrrty target/release/xtask "$RUNNER_TEMP/bin/"
          git rev-parse HEAD > "$RUNNER_TEMP/bin/brrrty-commit.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin
          path: ${{ runner.temp }}/bin
          retention-days: 1

  site:
    name: ${{ matrix.repo }}
    needs: [plan, build]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        include: ${{ fromJSON(needs.plan.outputs.sites) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: corpus
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin
          path: ${{ runner.temp }}/bin
      # The same commit the build job compiled: xtask reads the 11ty clock shim from it.
      - name: Check out the same brrrty
        run: |
          git init -q brrrty
          git -C brrrty fetch -q --depth 1 https://github.com/brrrty/brrrty.git "$(cat "$RUNNER_TEMP/bin/brrrty-commit.txt")"
          git -C brrrty checkout -q FETCH_HEAD
          chmod +x "$RUNNER_TEMP/bin/brrrty" "$RUNNER_TEMP/bin/xtask"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      # Lets `unshare -rn` give 11ty's builds a network namespace with no network.
      - name: Allow user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
      - name: Build the site with 11ty and Brrrty
        env:
          REPO: ${{ matrix.repo }}
        run: |
          "$RUNNER_TEMP/bin/xtask" corpus --runner native \
            --brrrty "$RUNNER_TEMP/bin/brrrty" \
            --list corpus/sites.toml --only "$REPO" \
            --sites-dir "$RUNNER_TEMP/sites" --work-dir "$RUNNER_TEMP/work" \
            --results "$RUNNER_TEMP/result.json" \
            --time-limit 2100 --runs 3
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: result-${{ matrix.slug }}
          path: ${{ runner.temp }}/result.json
          if-no-files-found: warn
          retention-days: 1
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: logs-${{ matrix.slug }}
          path: |
            ${{ runner.temp }}/work/${{ matrix.slug }}/logs
            ${{ runner.temp }}/work/${{ matrix.slug }}/report.md
          if-no-files-found: ignore
          retention-days: 1

  report:
    needs: [plan, build, site]
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: corpus
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bin
          path: ${{ runner.temp }}/bin
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
      - name: Merge and report
        run: |
          chmod +x "$RUNNER_TEMP/bin/xtask"
          mkdir -p out
          "$RUNNER_TEMP/bin/xtask" corpus-merge --list corpus/sites.toml --out out/corpus.json results/*/result.json
          "$RUNNER_TEMP/bin/xtask" corpus-report out/corpus.json > out/report.md
          {
            echo "# Corpus run: brrrty $(cat "$RUNNER_TEMP/bin/brrrty-commit.txt")"
            echo
            cat out/report.md
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-results
          path: out
          retention-days: 1
